<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>

    <!-- This is the necessary script for React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div class="js-container"></div>

    <script type="text/babel">
        function ProductDetails({ product, price }){
            return(
                <>
                    {product}
                    <p>Price: ${ price }</p>
                    <button> Add to Cart</button>
                </>
            );
        }

      function Form(){
        return(
            <div>
                <p>Hello, welcome to my website!</p>
                <div>
                    <input type="text" placeholder = 'Email'/>
                </div>
                <div>
                    <input type="password" placeholder = 'password'/>
                </div>
                <div>
                    <button>Login</button>
                    <button>SignUp</button>
                </div>
            </div>
        );
      }

      function App(){
        return(
            <>
              <Form />
              <ProductDetails product = 'Cotton socks' price = '10.90'/>
              <ProductDetails product = 'Tennis balls' price = '6.00'/>
              <ProductDetails product = 'Plain T-shirt' price = '7.99'/>
            </>
        );
      }



      const container = document.querySelector('.js-container');

      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
