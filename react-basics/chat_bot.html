<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <link rel="stylesheet" href="/chatbot.css">
    <!-- This is the necessary script for React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
  </head>

  <body>
    <div class="js-container"></div>

    <script type="text/babel">
      function ChatInput({ chatmessages, setChatMessages }){
        const [enteredMessage, setMessage] = React.useState('');
        
        function inputMessage(event){
          setMessage(event.target.value);
        }

        function sendMessage(){
          const newChatMessages = [
            ...chatmessages,
            {message: enteredMessage , sender: 'user', id: crypto.randomUUID()}            
          ];


          setChatMessages(newChatMessages);

          const response = Chatbot.getResponse(enteredMessage);
          setChatMessages([
            ...newChatMessages,
            {message: response , sender: 'robot', id: crypto.randomUUID()}            
          ]); 
          // CLEAR the input after pressing enter
          setMessage('');
        }

        function handleSubmit(event){
          if(event.key === 'Enter'){
            sendMessage();
          }
        }

        return(
          <div className = "Chat-Input">
            <input 
            type="text" 
            placeholder = "Entere you prompt here!!"
            onChange = {inputMessage}
            value = {enteredMessage}
            style = {{borderColor: 'black'}} 
            className = 'text-input'
            onKeyDown = {handleSubmit}
            />

            <button onClick = {sendMessage} className = "send-button">Send</button>
          </div>
        );
      }

      function ChatMessage(props){
        const message = props.message;
        const theSender = props.sender;

        if (theSender === 'robot'){
          return(
          <div className= 'robot'>
            <img src="robot-icon-isolated-contour-symbol-illustration-vector.jpg" alt="user_icon" width = '50' className = 'image'/>
            <p className ='messages'>{message}</p>
            
          </div>
        );
        }else{
          return(
          <div className = 'human'>
            <p className = 'messages'>{message}</p>
            <img src="Sample_User_Icon.png" alt="user_icon" width = '50' className = 'image'/>
          </div>
        );
        }
      }

      function MessageHistory({ chatmessages }){
        const chatMessageRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = chatMessageRef.current;
          if (containerElem){
            containerElem.scrollIntoView({ behavior: 'smooth' });
          }
        }, [chatmessages]) 

        const allMessage = chatmessages.map((chatmessage) => {
          return(
            <div className= 'message-box' key = {chatmessage.id}>
              <ChatMessage 
              message = {chatmessage.message}
              sender = {chatmessage.sender}
              key = {chatmessage.id}
              />
            </div>
          );
        });

        return(
          <>
            {allMessage}
            <div ref = {chatMessageRef}></div>
          </>
        );
      }

      function App(){
        const [chatmessages, setChatMessages] = React.useState([{
            message: "Hi Chat",
            sender: "user",
            id:'id1'
        },{
            message: "Hello, How can I help you?",
            sender: "robot",
            id:'id2'
        },{
            message: "can you get me todays date?",
            sender: "user",
            id:'id3'
        },{
            message: "Today is May 12, 2026 ",
            sender: "robot",
            id:'id4'
        }]);


        return(
          <div className='super-cont'>
            <div className = 'main-cont'>
              <div className = 'history-container'>
                <MessageHistory
                chatmessages = {chatmessages}
                />
              </div>
              <div>
                <ChatInput
                chatmessages = {chatmessages}
                setChatMessages = {setChatMessages}
                />
              </div>
            </div>
          </div>
        );
      }



      const container = document.querySelector('.js-container');

      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
